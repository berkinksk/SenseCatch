name: CI

# Compiles every tracked Python file on each push and pull request.
# This is a fast syntax check that needs no project dependencies.
on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all tracked Python files
        run: python -m py_compile $(git ls-files '*.py')
