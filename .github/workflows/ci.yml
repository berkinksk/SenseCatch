name: CI

# Runs on every push and pull request. The compile job checks that every tracked
# Python file is valid, and the test job installs the app's dependencies and runs pytest.
on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile all tracked Python files
        run: python -m py_compile $(git ls-files '*.py')

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.2.0
      - name: Run the tests
        run: python -m pytest -q
